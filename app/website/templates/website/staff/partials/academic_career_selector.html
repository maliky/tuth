{% if career_selector %}
  <form class="staff-career-selector" method="get" action="{{ career_selector.action_url }}">
    {% for field in career_selector.hidden_fields %}
      <input type="hidden" name="{{ field.name }}" value="{{ field.value }}">
    {% endfor %}
    <select id="staff-academic-career" class="form-select form-select-sm" name="{{ career_selector.param_name }}" aria-label="Academic career" onchange="this.form.submit()">
      {% for option in career_selector.options %}
        <option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>{{ option.label }}</option>
      {% endfor %}
    </select>
  </form>
{% endif %}
